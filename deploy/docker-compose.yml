version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mms_db
      POSTGRES_USER: mms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mms_user -d mms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mms_user:${DB_PASSWORD:-change_this_password}@db:5432/mms_db?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-generate-me-with-openssl}
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  uploads:
