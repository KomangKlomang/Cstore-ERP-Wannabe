# /etc/nginx/sites-available/mms
# Ganti erp.yourdomain.com dengan domain VPS kamu

server {
    listen 80;
    server_name erp.yourdomain.com;

    # Redirect HTTP → HTTPS (uncomment setelah setup SSL)
    # return 301 https://$server_name$request_uri;

    # ── Static file uploads (served langsung oleh Nginx, bypass Node.js)
    location /uploads/ {
        alias /var/data/mms/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;

        # Limit file types yang boleh di-serve
        location ~* \.(jpg|jpeg|png|gif|webp|svg|pdf|ico)$ {
            try_files $uri =404;
        }

        # Block everything else
        return 403;
    }

    # ── Next.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Upload size limit (sesuaikan dengan MAX_FILE_SIZE_MB)
        client_max_body_size 10M;
    }
}

