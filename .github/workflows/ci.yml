name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # lib/generated/prisma tidak di-commit, jadi harus di-generate dulu
      # atau tsc/next build gagal dengan "Cannot find module".
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # lib/generated/prisma tidak di-commit, jadi harus di-generate dulu
      # atau tsc/next build gagal dengan "Cannot find module".
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build
